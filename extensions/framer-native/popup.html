<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Framer → Revyme</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Framer → Revyme</h1>
      <p class="intro">Capture native editor tree, then send directly or paste JSON into Revyme.</p>
      <label for="scope">Scope to capture</label>
      <select id="scope">
        <option value="component">Open component</option>
        <option value="page">Open page</option>
        <option value="selection">Selected layers</option>
        <option value="project">Entire project</option>
      </select>
      <button id="capture" type="button" class="primary">Capture Tree</button>
      <p id="status" role="status" aria-live="polite">Open the desired project in Framer.</p>
      <dl id="summary" hidden></dl>
      <button id="send-revyme" type="button" class="primary" style="margin-top: 0; margin-bottom: 8px;" disabled>Send to Revyme</button>
      <button id="download-clean" type="button" class="primary" style="margin-top: 0; margin-bottom: 8px; background: #2563eb;" disabled>Save Clean Revyme JSON</button>
      <div class="actions">
        <button id="download" type="button" disabled>Save Raw JSON</button>
        <button id="copy" type="button" disabled>Copy Raw JSON</button>
      </div>
      <p class="note">Data stays local. Reader inspects native source and dependencies without editing the document.</p>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
